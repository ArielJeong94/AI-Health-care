<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>CSS 실습</title>
        <style>
            .box {
                padding: 10px;
                margin: 20px;
                border: 3px solid blue;
            }
            h1 {
                color: green;
            }
            .highlight {
                color: red;
            }
            #special {
                color: yellow;
            }
            .content {
                width: 50%;
                font-size: 1.5em;
            }
        </style>
    </head>
    <body>

        <h1 class="highlight">박스 모델 실습</h1>
        <h1 id="special">우선순위 실습</h1>

        <div class="box content">
            이곳은 박스 모델이 적용된 콘텐츠입니다.
        </div>

    </body>
</html>
